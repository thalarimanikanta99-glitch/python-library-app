
services:
  db:
    image: manikantathalari/pyapp:database_image
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: manikantathalari/pyapp:auth_image
    deploy:
      replicas: 1 
    ports:
      - "5001:5001"
    networks:
      - mynetwork

  books_service:
    image: manikantathalari/pyapp:book_image
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork

  borrow_service:
    image: manikantathalari/pyapp:borrow_image
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork

  frontend:
    image: manikantathalari/pyapp:frontend
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    depends_on:
      - auth_service
      - book_service
      - borrow_service
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
