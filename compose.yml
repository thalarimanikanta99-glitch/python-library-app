
services:
  db:
    image: manikantathalari/pyapp:database_image
    ports:
      - "3306:3306"
    networks:
      - mynet

  auth_service:
    image: manikantathalari/pyapp:auth_image
    ports:
      - "5001:5001"
    networks:
      - mynet

  books_service:
    image: manikantathalari/pyapp:book_image
    ports:
      - "5002:5002"
    networks:
      - mynet

  borrow_service:
    image: manikantathalari/pyapp:borrow_image
    ports:
      - "5003:5003"
    networks:
      - mynet

  frontend:
    image: manikantathalari/pyapp:frontend
    ports:
      - "5000:5000"
    networks:
      - mynet

networks:
  mynet:
    driver: overlay
