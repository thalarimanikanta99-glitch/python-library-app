---
services:
  db:
    container_name: db
    build: ./database/
    ports:
      - "3306:3306"
    networks:
      - mynet

  auth_service:
    container_name: auth_service
    build: ./auth/
    ports:
      - "5001:5001"
    networks:
      - mynet

  books_service:
    container_name: book_service
    build: ./book/
    ports:
      - "5002:5002"
    networks:
      - mynet

  borrow_service:
    container_name: borrow_service
    build: ./borrow/
    ports:
      - "5003:5003"
    networks:
      - mynet

  frontend_service:
    container_name: frontend
    build: ./
    ports:
      - "5000:5000"
    networks:
      - mynet

networks:
  mynet:
    driver: bridge
